name: Skrrt
options:
  bundleIdPrefix: dev.skrrt
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.5.0
targets:
  Skrrt:
    type: application
    dependencies:
      - package: Lottie
    platform: iOS
    sources:
      - path: Skrrt
      - path: Store
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.skrrt.browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: NO
    info:
      path: Skrrt/Info.plist
      properties:
        CFBundleDisplayName: Skrrt
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ru
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: Websites you open can ask to use the camera.
        NSMicrophoneUsageDescription: Websites you open can ask to use the microphone.
        NSLocationWhenInUseUsageDescription: Websites you open can ask for your location.
        NSPhotoLibraryAddUsageDescription: Save images from websites to your photos.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
